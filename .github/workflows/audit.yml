# 依赖已知漏洞（RustSec）：每周一跑一次，Cargo.lock 变了也跑。
name: audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
  push:
    paths: ['Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  pull_request:
    paths: ['Cargo.lock', '.cargo/audit.toml']

# audit-check 要往提交上写 check run（checks: write）、发现漏洞时开 issue（issues: write）；少了 checks 会在 push 事件上报 "Resource not accessible by integration"
permissions:
  contents: read
  checks: write
  issues: write

jobs:
  audit:
    if: github.repository == 'qingjian-team/qingjian' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
